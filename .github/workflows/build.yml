name: CI

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ dev, release ]

jobs:


  build:
    strategy:
      fail-fast: false
      matrix:
        lua_ver: [51, 53]
        numbers: ['float']
        include:
          - lua_ver: 51
            numbers: 'integral'  
          - lua_ver: 53
            numbers: '64bit'  
    runs-on: ubuntu-22.04

    env:
      LUA: ${{ matrix.lua_ver }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - run: pip install pyserial
      shell: bash
    - run: sudo apt install srecord
      shell: bash
    - name: Build firmware
      if: matrix.numbers == 'float'
      run: make
      shell: bash
    - name: Build integral firmware
      if: ${{ matrix.numbers == 'integral' }}
      run: |
        make EXTRA_CCFLAGS="-DLUA_NUMBER_INTEGRAL"
        mv luac.cross.int luac.cross
      shell: bash
    - name: Build 64bit firmware
      if: ${{ matrix.numbers == '64bit' }}
      run: |
        make EXTRA_CCFLAGS="-DLUA_NUMBER_64BITS"
      shell: bash
    - name: Upload luac.cross
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: luac.cross_${{ matrix.lua_ver }}_${{ matrix.numbers }}
        path: luac.cross

  build_win_msys2:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lua_ver: 51
            numbers: float
          - lua_ver: 51
            numbers: integral
          - lua_ver: 53
            numbers: float
          - lua_ver: 53
            numbers: 64bit

    env:
      LUA: ${{ matrix.lua_ver }}
      MSYSTEM: MINGW32
      CHERE_INVOKING: 1

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - uses: msys2/setup-msys2@v2
      with:
        update: true
        cache: true
        install: >-
          make
          gcc
          python
          python-pip
          unzip

    - name: Setup Python venv
      shell: msys2 {0}
      run: |
        python -m venv .venv
        . .venv/bin/activate
        python -m pip install --upgrade pip
        pip install pyserial

    - name: Build firmware
      shell: msys2 {0}
      run: |
        . .venv/bin/activate

        EXTRA_FLAGS=""
        if [ "${{ matrix.numbers }}" = "integral" ]; then
          EXTRA_FLAGS="-DLUA_NUMBER_INTEGRAL"
        elif [ "${{ matrix.numbers }}" = "64bit" ]; then
          EXTRA_FLAGS="-DLUA_NUMBER_64BITS"
        fi
        make EXTRA_CCFLAGS=$EXTRA_FLAGS
        
        if [ "${{ matrix.numbers }}" = "integral" ]; then
          mv -f luac.cross.int.exe luac.cross.exe
        fi

    - name: Copy required DLLs
      shell: msys2 {0}
      run: |
        ldd luac.cross.exe | awk '{print $3}' | grep -vi "/c/windows" | xargs -I{} cp -v {} . || true
        ls *.dll

    - name: Check build items
      shell: msys2 {0}
      run: |
        ls -ll bin/0x00000.bin bin/0x10000.bin luac.cross.exe

    - name: Upload luac.cross
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: luac.cross_${{ matrix.lua_ver }}_${{ matrix.numbers }}_win
        path: |
          luac.cross.exe
          *.dll

